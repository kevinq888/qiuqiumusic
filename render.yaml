services:
  # 主站：weimomusic.onrender.com（wmusic 子域名已被其他账号占用，只能加后缀，故用 weimomusic）
  - type: web
    name: weimomusic
    runtime: node
    plan: free
    region: singapore
    buildCommand: node --check server.js
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
  # 旧站：wmusic 验证通过后暂停
  - type: web
    name: qiuqiumusic
    runtime: node
    plan: free
    region: singapore
    buildCommand: node --check server.js
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
